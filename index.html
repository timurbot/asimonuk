<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asım ONUK | ADP Kocaeli İl Başkanı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --adp-blue: #0c1a40; --adp-orange: #ff6600; --bg-gray: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg-gray); padding-bottom: 100px; text-align: center; }
        header { background: #fff; padding: 15px; border-bottom: 4px solid var(--adp-blue); margin-bottom: 30px; }
        .header-logo { max-height: 60px; width: auto; }
        .hero { padding: 0 20px; }
        .profile-img { 
            width: 180px; height: 180px; border-radius: 50%; 
            border: 5px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            object-fit: cover; margin-bottom: 20px;
        }
        h2 { color: var(--adp-blue); font-size: 1.8rem; margin-bottom: 5px; }
        .title { color: var(--adp-orange); font-weight: bold; margin-bottom: 25px; display: block; }
        .card { background: #fff; margin: 20px; padding: 25px; border-radius: 15px; border-left: 5px solid var(--adp-blue); text-align: left; }
        .btn-group { padding: 0 20px; display: grid; gap: 15px; }
        .btn { 
            text-decoration: none; color: #fff; padding: 18px; border-radius: 12px; 
            font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-blue { background: var(--adp-blue); }
        .btn-green { background: #25d366; }
        .btn i { margin-right: 10px; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="ADP Logo" class="header-logo">
    </header>
    <div class="hero">
        <img src="Asim-Onuk-Profil-min.jpg" alt="Asım ONUK" class="profile-img">
        <h2>Asım ONUK</h2>
        <span class="title">KOCAELİ İL BAŞKANI</span>
    </div>
    <div class="card">
        <p>Kocaeli’nin dertlerini yerinde dinlemek, her bir vatandaşımızın sesine kulak vermek için yola çıktık. Adaletin ve demokrasinin gücüyle şehrimizi birlikte inşa edeceğiz.</p>
    </div>
    <div class="btn-group">
        <a href="tel:+905322831826" class="btn btn-blue"><i class="fa-solid fa-phone"></i> Başkanla Görüş</a>
        <a href="https://wa.me/905322831826?text=Merhaba%20Başkanım," class="btn btn-green"><i class="fa-brands fa-whatsapp"></i> WhatsApp Hattı</a>
    </div>
</body>
</html>
